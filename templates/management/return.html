{% extends "management/base.html" %}
{% load static %}

{% block title %}操作结果{% endblock %}

{% block content %}
<div class="container">
    <div class="row" style="margin-top: 100px;">
        <div class="col-md-6 col-md-offset-3">
            <div class="panel panel-default" style="border-radius: 15px; box-shadow: 0 5px 15px rgba(0,0,0,0.1);">
                <div class="panel-body text-center" style="padding: 50px 20px;">
                    <i class="glyphicon glyphicon-ok-circle" style="font-size: 80px; color: #5cb85c;"></i>

                    <h2 style="margin-top: 30px; color: #333;">{{ info }}</h2>

                    <p class="text-muted" style="margin-top: 20px;">系统已成功处理您的请求</p>

                    <hr style="width: 80%; margin: 30px auto;">

                    <div class="btn-group">
                        <a href="{% url 'homepage' %}" class="btn btn-primary btn-lg">
                            <i class="glyphicon glyphicon-home"></i> 返回首页
                        </a>
                        <a href="javascript:history.back()" class="btn btn-default btn-lg" style="margin-left: 10px;">
                            <i class="glyphicon glyphicon-arrow-left"></i> 返回上一页
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
